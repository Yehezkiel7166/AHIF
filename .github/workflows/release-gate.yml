name: Release gate
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make release-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification-reports
          path: reports/
          if-no-files-found: error
