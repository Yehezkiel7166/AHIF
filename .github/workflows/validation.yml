name: Executable verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Canonical full harness
        env:
          AHIF_MACHINE: "1"
        run: make test
      - name: Job summary
        if: always()
        run: echo '### AHIF repository verification — release/LTS remain HOLD' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/reports/
          if-no-files-found: error
          retention-days: 14
